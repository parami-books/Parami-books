<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parami Books - Colección Oficial</title>
  
  <!-- Fuentes Premium de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos base -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Definición del degradado de oro usado por los elementos y SVGs de la web -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe082" />
        <stop offset="30%" stop-color="#e5a93b" />
        <stop offset="55%" stop-color="#fff8e1" />
        <stop offset="85%" stop-color="#c68a23" />
        <stop offset="100%" stop-color="#b27a1c" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Contenedor principal de ancho móvil -->
  <div class="container">
    
    <!-- Encabezado de la página -->
    <header>
      <div class="logo-outer-container">
        <div class="logo-container">
          <div class="brand-icon">PB</div>
        </div>
      </div>
      
      <h1 class="js-brand-name">Parami Books</h1>
      
      <!-- Separador clásico de orla dorada -->
      <div class="header-separator">
        <svg viewBox="0 0 100 10" class="ornament-svg">
          <path d="M0,5 L40,5 C42,5 44,4 45,2 L48,5 L50,1 L52,5 L55,2 C56,4 58,5 60,5 L100,5" stroke="url(#goldGrad)" stroke-width="1.2" fill="none"/>
          <polygon points="50,1.5 52.5,5 50,8.5 47.5,5" fill="url(#goldGrad)"/>
        </svg>
      </div>

      <p class="tagline js-brand-tagline">Cargando colección...</p>
      
      <!-- Redes Sociales Orgánicas (TikTok) -->
      <div class="social-buttons">
        <a href="#" class="social-link js-tiktok-link" target="_blank" rel="noopener noreferrer" title="Síguenos en TikTok">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Indicador dinámico de tienda por país -->
    <div id="countryBanner" class="country-banner">
      <span class="flag">🌐</span>
      <span>Detectando tienda...</span>
    </div>

    <!-- Catálogo interactivo de libros renderizados dinámicamente -->
    <main id="bookCatalog" class="catalog">
      <!-- Tarjetas de libros cargando -->
      <p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px;">Cargando catálogo...</p>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>&copy; <span id="year">2026</span> <span class="js-brand-name">Parami Books</span>. Todos los derechos reservados.</p>
    </footer>

  </div>

  <!-- Carga de Configuración General y script de lógica -->
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
