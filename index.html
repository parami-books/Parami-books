<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parami Books - Colección Oficial de Libros para Colorear</title>
  
  <!-- Meta etiquetas SEO básicas -->
  <meta name="description" content="Libros para colorear adorables y sencillos, diseñados para regalarte un momento de calma y desconexión. Colección oficial de Parami Books.">
  <meta name="keywords" content="parami books, libros para colorear, coloring books, mandalas flowers, smiling animals, bold and easy coloring book, kdp amazon">
  <meta name="author" content="Parami Books">
  
  <!-- Tarjetas Open Graph (Redes Sociales y WhatsApp) -->
  <meta property="og:title" content="Parami Books - Colección Oficial de Libros para Colorear">
  <meta property="og:description" content="Libros para colorear adorables y sencillos, diseñados para regalarte un momento de calma y desconexión.">
  <meta property="og:url" content="https://parami-books.github.io/Parami-books/">
  <meta property="og:type" content="website">
  
  <!-- Fuentes Premium de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@400;600;800;950&display=swap" rel="stylesheet">
  
  <!-- Estilos base -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Definición del degradado de oro usado por los elementos y SVGs de la web -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe082" />
        <stop offset="30%" stop-color="#e5a93b" />
        <stop offset="55%" stop-color="#fff8e1" />
        <stop offset="85%" stop-color="#c68a23" />
        <stop offset="100%" stop-color="#b27a1c" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Contenedor principal de ancho móvil -->
  <div class="container">
    
    <!-- Encabezado de la página - Diseño 3D Vectorial Integrado -->
    <header class="compact-header">
      <!-- Logo removido para dar más ancho al título central -->
      
      <!-- Columna Central: Título 3D Vectorial y Burbuja Tagline -->
      <div class="header-center">
        <div class="brand-title-container">
          <svg viewBox="0 0 540 85" class="brand-title-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="paramiGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ff3b30" />
                <stop offset="60%" stop-color="#cc1105" />
                <stop offset="100%" stop-color="#990700" />
              </linearGradient>
              <linearGradient id="booksGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe956" />
                <stop offset="60%" stop-color="#f5b800" />
                <stop offset="100%" stop-color="#c68a00" />
              </linearGradient>
            </defs>
            
            <!-- PARAMI (Rojo con borde amarillo y extrusión 3D) -->
            <g font-family="'Lilita One', sans-serif" font-size="62" font-weight="900" letter-spacing="1">
              <!-- Sombras de extrusión 3D -->
              <text x="10" y="65" fill="#3b0200">PARAMI</text>
              <text x="10" y="64" fill="#690300">PARAMI</text>
              <text x="10" y="63" fill="#8f0500">PARAMI</text>
              <text x="10" y="62" fill="#b00600">PARAMI</text>
              <text x="10" y="61" fill="#cc0700">PARAMI</text>
              <!-- Capa superior con trazo y brillo -->
              <text x="10" y="60" fill="url(#paramiGrad)" stroke="#ffd200" stroke-width="5" paint-order="stroke fill" filter="drop-shadow(0 3px 2px rgba(0,0,0,0.3))">PARAMI</text>
            </g>

            <!-- BOOKS (Amarillo con borde rojo y extrusión 3D) -->
            <g font-family="'Lilita One', sans-serif" font-size="62" font-weight="900" letter-spacing="1">
              <!-- Sombras de extrusión 3D -->
              <text x="290" y="65" fill="#3b0200">BOOKS</text>
              <text x="290" y="64" fill="#690300">BOOKS</text>
              <text x="290" y="63" fill="#8f0500">BOOKS</text>
              <text x="290" y="62" fill="#b00600">BOOKS</text>
              <text x="290" y="61" fill="#cc0700">BOOKS</text>
              <!-- Capa superior con trazo y brillo (amarillo/rojo invertido) -->
              <text x="290" y="60" fill="url(#booksGrad)" stroke="#e22b2b" stroke-width="5" paint-order="stroke fill" filter="drop-shadow(0 3px 2px rgba(0,0,0,0.3))">BOOKS</text>
            </g>
          </svg>
        </div>
        <div class="tagline-bubble">
          <p class="tagline js-brand-tagline">Cargando colección...</p>
        </div>
      </div>
      
      <!-- Columna Derecha: Selector de Idioma e Icono TikTok (100% Vectorial) -->
      <div class="header-right">
        <div class="lang-selector-container">
          <button class="lang-btn" id="btnLangEs" onclick="changeLanguage('es')">
            <span class="lang-flag-circle" id="flagEs"></span>
            <span class="lang-text">ES</span>
          </button>
          <button class="lang-btn" id="btnLangEn" onclick="changeLanguage('en')">
            <span class="lang-flag-circle" id="flagEn"></span>
            <span class="lang-text">EN</span>
          </button>
        </div>
        
        <!-- Botón de TikTok (Moneda 3D interactiva en CSS y SVG) -->
        <a href="#" class="tiktok-coin-3d js-tiktok-link" target="_blank" rel="noopener noreferrer" title="TikTok">
          <svg class="tiktok-svg-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g class="tiktok-logo-group">
              <path d="M58,15 L58,48 C58,58.5 49.5,67 39,67 C28.5,67 20,58.5 20,48 C20,37.5 28.5,29 39,29 C40,29 41,29.1 42,29.3 L42,19.3 C40.8,19.1 39.9,19 39,19 C23,19 10,32 10,48 C10,64 23,77 39,77 C55,77 68,64 68,48 L68,36 C74,40 81.5,42.5 90,42.5 L90,32.5 C80,32.5 71,26 68.5,15 Z" fill="#00f2fe" transform="translate(-2.2, -1.2)" />
              <path d="M58,15 L58,48 C58,58.5 49.5,67 39,67 C28.5,67 20,58.5 20,48 C20,37.5 28.5,29 39,29 C40,29 41,29.1 42,29.3 L42,19.3 C40.8,19.1 39.9,19 39,19 C23,19 10,32 10,48 C10,64 23,77 39,77 C55,77 68,64 68,48 L68,36 C74,40 81.5,42.5 90,42.5 L90,32.5 C80,32.5 71,26 68.5,15 Z" fill="#fe0979" transform="translate(1.8, 1.2)" />
              <path d="M58,15 L58,48 C58,58.5 49.5,67 39,67 C28.5,67 20,58.5 20,48 C20,37.5 28.5,29 39,29 C40,29 41,29.1 42,29.3 L42,19.3 C40.8,19.1 39.9,19 39,19 C23,19 10,32 10,48 C10,64 23,77 39,77 C55,77 68,64 68,48 L68,36 C74,40 81.5,42.5 90,42.5 L90,32.5 C80,32.5 71,26 68.5,15 Z" fill="#ffffff" />
            </g>
          </svg>
        </a>
      </div>
    </header>

    <!-- Indicador dinámico de tienda por país -->
    <div id="countryBanner" class="country-banner">
      <span class="flag">🌐</span>
      <span>Detectando tienda...</span>
    </div>

    <!-- Catálogo interactivo de libros renderizados dinámicamente -->
    <main id="bookCatalog" class="catalog">
      <!-- Tarjetas de libros cargando -->
      <p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px;">Cargando catálogo...</p>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>&copy; <span id="year">2026</span> <span class="js-brand-name">Parami Books</span>. Todos los derechos reservados.</p>
    </footer>

  </div>

  <!-- Carga de Configuración General y script de lógica -->
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
